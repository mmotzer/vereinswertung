# Optionaler eigener Portainer-Stack. Bei vorhandenem Tunnel nur das Netzwerk anschließen.
services:
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Cloudflare-Tunnel-Token setzen}
    networks:
      - club
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  club:
    external: true
    name: vereinswertung-net

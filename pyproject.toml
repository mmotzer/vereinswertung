[tool.ruff]
target-version = "py313"
line-length = 80
include = ["/*.py", "vereinswertung/**/*.py", "tests/**/*.py", "tools/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/browser_fixture.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

<body><main class="page"><article class="card prose"><div class="eyebrow">VEREINSWERTUNG</div><h1>Willkommen im Verein.</h1><p>Ranglisten, Spielerprofile und Turniere sind nur nach Anmeldung zugänglich.</p><form id="private-login"><label id="bootstrap-label" hidden>Einrichtungsschlüssel<input name="token" type="password" autocomplete="off"></label><label>Benutzername<input name="username" autocomplete="username" minlength="3" maxlength="50" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" maxlength="200" required></label><p id="login-error" class="error" role="alert" hidden></p><button class="button" id="private-submit" disabled>Anmelden →</button></form><p><a href="https://github.com/mmotzer/vereinswertung" rel="noopener noreferrer">Quellcode auf GitHub</a></p></article></main></body></html>
